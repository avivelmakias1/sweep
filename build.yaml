# This file generates the GitHub Actions matrix.
#
# Dongle-only. The dongle is the split central. Both halves are peripherals.
# The old left-central build is not kept: the left shield cannot be central
# and peripheral in one config file, and one flash story is enough.
#
# nice_nano//zmk is nice!nano v2 (board revision 2.0.0). Current ZMK main
# removed the nice_nano_v2 board id.
---
include:
  - board: nice_nano//zmk
    shield: cradio_dongle
    artifact-name: cradio_dongle
  - board: nice_nano//zmk
    shield: cradio_left
    artifact-name: cradio_left
  - board: nice_nano//zmk
    shield: cradio_right
    artifact-name: cradio_right
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
