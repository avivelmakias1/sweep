# Right half is a peripheral (the shield already defaults to that).
# The explicit override keeps both halves the same if the shield default changes.

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Deep sleep after 30 minutes. The direct-gpio kscan is a wakeup source,
# so a key press wakes the half. The dongle does not sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Eager debouncing. Only the GPIO key scan on the halves uses these.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
