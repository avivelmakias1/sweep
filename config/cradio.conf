# Shared by the dongle and both halves.
#
# Host-facing options live in cradio_dongle.conf.
# Key scanning, deep sleep, and debounce live in cradio_left.conf and
# cradio_right.conf. Those symbols are not valid on the keyless dongle,
# and deep sleep on the dongle would power it off with no key to wake it.

# Uncomment on every part to raise split and host link power.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
