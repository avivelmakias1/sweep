# Dongle: split central. USB HID when plugged in, and BLE HID to the host.
# The halves never connect to the computer.

# Disables 2M PHY. This is the Linux connection workaround, and it applies
# to the radio that talks to the host.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# HID reports are built on the central.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Fetch both halves and publish them on a second Battery Service.
# See the README for what the host actually shows over USB vs BLE.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Assigned here as well as in the shield defconfig so a one-peripheral
# default cannot win.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
