# Dongle: split central. The computer sees it over USB only.
# The halves connect to the dongle over BLE. They never connect to the computer.

# Do not advertise as a BLE keyboard. Split scanning is unchanged.
CONFIG_SWEEP_USB_ONLY_DONGLE=y

# HID reports are built on the central and sent over USB.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Fetch both halves and keep the values on the dongle. USB HID has no
# battery report, and the dongle does not advertise BLE to the computer,
# so the OS battery icon will not show them.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Assigned here as well as in the shield defconfig so a one-peripheral
# default cannot win. The extra slots are unused host profiles. The
# dongle does not advertise them.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
